# Builds recovery-prototype/ and deploys it to Cloudflare Pages (Direct Upload via Wrangler).
# MANUAL ONLY: started from Actions → "Deploy recovery prototype" → Run workflow,
# with "Use workflow from" = claude/revenue-recovery-engine-stage-1-8xg8vf.
# Pushes never deploy. Runs from any other branch are skipped.
# Deploys as the Pages project's PRODUCTION branch ("main"):
# https://revenue-recovery-v0.pages.dev
#
# Required repository settings (Settings → Secrets and variables → Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN            (Account › Cloudflare Pages › Edit — nothing else)
#              CLOUDFLARE_ACCOUNT_ID
#              VITE_SUPABASE_PUBLISHABLE_KEY   (public sb_publishable_… key)
#   Variables: VITE_SUPABASE_URL               (https://aqwdwswpmbnzmkvyuqil.supabase.co)
#
# Never put a secret / service-role key in the VITE_* values: anything VITE_* is
# compiled into public JavaScript. The "Check configuration" step refuses to build if so.

name: Deploy recovery prototype (Cloudflare Pages)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-revenue-recovery-v0
  cancel-in-progress: false

jobs:
  deploy:
    # Only the development branch may be deployed.
    if: github.ref == 'refs/heads/claude/revenue-recovery-engine-stage-1-8xg8vf'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: recovery-prototype
    env:
      CF_PAGES_PROJECT: revenue-recovery-v0
      EXPECTED_SUPABASE_URL: https://aqwdwswpmbnzmkvyuqil.supabase.co
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recovery-prototype/package-lock.json

      # Fails before building, without printing any value, if configuration is
      # missing or if a privileged key would be baked into the public bundle.
      - name: Check configuration
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          fail=0
          [ "$HAS_CF_TOKEN" = "true" ]   || { echo "::error::Secret CLOUDFLARE_API_TOKEN is not set"; fail=1; }
          [ "$HAS_CF_ACCOUNT" = "true" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is not set"; fail=1; }
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Repository variable VITE_SUPABASE_URL is not set"; fail=1
          elif [ "$VITE_SUPABASE_URL" != "$EXPECTED_SUPABASE_URL" ]; then
            echo "::error::VITE_SUPABASE_URL is not the staging project ($EXPECTED_SUPABASE_URL). Check spelling and remove any trailing slash."; fail=1
          fi
          key="$VITE_SUPABASE_PUBLISHABLE_KEY"
          case "$key" in
            "") echo "::error::Repository secret VITE_SUPABASE_PUBLISHABLE_KEY is not set"; fail=1 ;;
            sb_publishable_*) ;;
            sb_secret_*) echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is a SECRET key. Remove it, rotate it in Supabase, use the publishable key."; fail=1 ;;
            eyJ*)
              payload=$(printf '%s' "$key" | cut -d. -f2 | tr '_-' '/+')
              while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
              if ! printf '%s' "$payload" | base64 -d 2>/dev/null | grep -q '"role":"anon"'; then
                echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is a JWT that is not the anon key (possibly service_role). Rotate it and use the publishable key."; fail=1
              fi ;;
            *) echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY has an unrecognised format"; fail=1 ;;
          esac
          exit $fail

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/_headers
          grep -qF "connect-src 'self' $EXPECTED_SUPABASE_URL;" dist/_headers
          if grep -rqE 'sb_secret_[A-Za-z0-9]' dist; then echo "::error::A secret key was found in the build output"; exit 1; fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.141.0 pages deploy dist
          --project-name="$CF_PAGES_PROJECT"
          --branch=main
          --commit-hash="$GITHUB_SHA"
