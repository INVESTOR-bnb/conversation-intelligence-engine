# Builds recovery-prototype/ and deploys it to Cloudflare Pages (Direct Upload via Wrangler).
# MANUAL ONLY: started from Actions → "Deploy recovery prototype" → Run workflow,
# with "Use workflow from" = claude/revenue-recovery-engine-stage-1-8xg8vf.
# Pushes never deploy. Runs from any other branch are skipped.
#
# Input "target" (default: frontend, exactly the Cloudflare deploy below). The other targets
# run ONLY the "paid-staging" job (Supabase STAGING, durable Kimi configuration for direct
# founder-dashboard analyses; it never calls Kimi and never starts an analysis):
#   paid-readiness                 read-only check (deployed function, Kimi settings by name/digest,
#                                  spending, eligible synthetic case, founder/business access, live site)
#   paid-activate                  offline tests → deploy analyze-case CODE (settings untouched) →
#                                  Kimi settings → spending ON (USD 3 allowance, USD 1 cap) → case → readiness
#   paid-deactivate                spending OFF (the Kimi key is kept)
#   paid-deactivate-and-remove-key spending OFF and the paid provider settings deleted
# The paid job runs in the protected environment "staging-paid", whose secrets are
# SUPABASE_ACCESS_TOKEN (sbp_…) and KIMI_API_KEY; values reach steps only as environment
# variables, never on a command line, and are never printed.
# Deploys as the Pages project's PRODUCTION branch ("main"):
# https://revenue-recovery-v0.pages.dev
#
# Required repository settings (Settings → Secrets and variables → Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN            (Account › Cloudflare Pages › Edit — nothing else)
#              CLOUDFLARE_ACCOUNT_ID
#              VITE_SUPABASE_PUBLISHABLE_KEY   (public sb_publishable_… key)
#   Variables: VITE_SUPABASE_URL               (https://aqwdwswpmbnzmkvyuqil.supabase.co)
#
# Never put a secret / service-role key in the VITE_* values: anything VITE_* is
# compiled into public JavaScript. The "Check configuration" step refuses to build if so.

name: Deploy recovery prototype (Cloudflare Pages)

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to run (frontend = deploy the site; paid-* = Supabase staging paid configuration)
        type: choice
        required: true
        default: frontend
        options: [frontend, paid-readiness, paid-activate, paid-deactivate, paid-deactivate-and-remove-key]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-revenue-recovery-v0
  cancel-in-progress: false

jobs:
  deploy:
    # Only the development branch may be deployed.
    if: github.ref == 'refs/heads/claude/revenue-recovery-engine-stage-1-8xg8vf' && (inputs.target == 'frontend' || inputs.target == '')
    runs-on: ubuntu-24.04 # pinned: Playwright 1.56.1 cannot install Chromium on ubuntu-latest (26.04)
    timeout-minutes: 25
    defaults:
      run:
        working-directory: recovery-prototype
    env:
      CF_PAGES_PROJECT: revenue-recovery-v0
      EXPECTED_SUPABASE_URL: https://aqwdwswpmbnzmkvyuqil.supabase.co
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history: the deploy-tooling tests check the branch contains earlier reviewed
          # stages and read old commits (rollback code), which a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recovery-prototype/package-lock.json

      # Fails before building, without printing any value, if configuration is
      # missing or if a privileged key would be baked into the public bundle.
      - name: Check configuration
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          fail=0
          [ "$HAS_CF_TOKEN" = "true" ]   || { echo "::error::Secret CLOUDFLARE_API_TOKEN is not set"; fail=1; }
          [ "$HAS_CF_ACCOUNT" = "true" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is not set"; fail=1; }
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Repository variable VITE_SUPABASE_URL is not set"; fail=1
          elif [ "$VITE_SUPABASE_URL" != "$EXPECTED_SUPABASE_URL" ]; then
            echo "::error::VITE_SUPABASE_URL is not the staging project ($EXPECTED_SUPABASE_URL). Check spelling and remove any trailing slash."; fail=1
          fi
          key="$VITE_SUPABASE_PUBLISHABLE_KEY"
          case "$key" in
            "") echo "::error::Repository secret VITE_SUPABASE_PUBLISHABLE_KEY is not set"; fail=1 ;;
            sb_publishable_*) ;;
            sb_secret_*) echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is a SECRET key. Remove it, rotate it in Supabase, use the publishable key."; fail=1 ;;
            eyJ*)
              payload=$(printf '%s' "$key" | cut -d. -f2 | tr '_-' '/+')
              while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
              if ! printf '%s' "$payload" | base64 -d 2>/dev/null | grep -q '"role":"anon"'; then
                echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is a JWT that is not the anon key (possibly service_role). Rotate it and use the publishable key."; fail=1
              fi ;;
            *) echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY has an unrecognised format"; fail=1 ;;
          esac
          exit $fail

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Automated tests. Any failure stops the run before anything is built or deployed.
      # The browser suites use the Stage-1 build and a MOCKED Supabase (no credentials),
      # so the real Supabase values are blanked for these steps.
      - name: Unit tests
        run: npm run test:unit

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests — Stage-1 prototype
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
        run: npm run test:e2e

      - name: Browser tests — sign-in, onboarding and cases (mocked Supabase)
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
        run: npm run test:live

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/_headers
          grep -qF "connect-src 'self' $EXPECTED_SUPABASE_URL;" dist/_headers
          if grep -rqE 'sb_secret_[A-Za-z0-9]' dist; then echo "::error::A secret key was found in the build output"; exit 1; fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.141.0 pages deploy dist
          --project-name="$CF_PAGES_PROJECT"
          --branch=main
          --commit-hash="$GITHUB_SHA"

  paid-staging:
    if: github.ref == 'refs/heads/claude/revenue-recovery-engine-stage-1-8xg8vf' && startsWith(inputs.target, 'paid-')
    runs-on: ubuntu-24.04
    environment: staging-paid
    timeout-minutes: 30
    defaults:
      run:
        working-directory: recovery-prototype
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # the deploy script checks the branch contains the reviewed stages

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recovery-prototype/package-lock.json

      # Names only: says which required secret is missing, never a value.
      - name: Check required secrets (names only)
        env:
          TARGET: ${{ inputs.target }}
          HAS_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_KIMI_API_KEY: ${{ secrets.KIMI_API_KEY != '' }}
        run: |
          ACTION="${TARGET#paid-}"
          fail=0
          [ "$HAS_SUPABASE_ACCESS_TOKEN" = "true" ] || { echo "::error::Missing secret SUPABASE_ACCESS_TOKEN in environment staging-paid"; fail=1; }
          if [ "$ACTION" = "activate" ] && [ "$HAS_KIMI_API_KEY" != "true" ]; then echo "::error::Missing secret KIMI_API_KEY in environment staging-paid"; fail=1; fi
          [ "$fail" = 0 ] && echo "required secrets present for $ACTION (values not shown)"
          exit $fail

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Offline tests (activate only)
        if: inputs.target == 'paid-activate'
        run: npm run typecheck && npm run test:unit

      # Code only: the deploy script writes NO provider setting in its default mode.
      - name: Deploy analyze-case code (provider settings untouched)
        if: inputs.target == 'paid-activate'
        env:
          RRE_NONINTERACTIVE: '1'
          CONFIRM_PROJECT_REF: aqwdwswpmbnzmkvyuqil
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash supabase/scripts/deploy-analyze-case-2a6d.sh

      - name: Run the chosen action
        env:
          TARGET: ${{ inputs.target }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: node supabase/scripts/paid-staging.mjs "${TARGET#paid-}"
