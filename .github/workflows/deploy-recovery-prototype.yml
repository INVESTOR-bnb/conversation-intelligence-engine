# Builds recovery-prototype/ and deploys it to Cloudflare Pages (Direct Upload via Wrangler).
# MANUAL ONLY: started from Actions → "Deploy recovery prototype" → Run workflow,
# with "Use workflow from" = claude/revenue-recovery-engine-stage-1-8xg8vf.
# Pushes never deploy. Runs from any other branch are skipped.
#
# Input "target" (default: frontend, exactly the Cloudflare deploy below). The other targets
# run ONLY the "paid-staging" job (Supabase STAGING, durable Kimi configuration for direct
# founder-dashboard analyses; it never calls Kimi and never starts an analysis):
#   paid-readiness                 read-only check (deployed function, Kimi settings by name/digest,
#                                  spending, eligible synthetic case, founder/business access, live site)
#   paid-activate                  offline tests → deploy analyze-case CODE (settings untouched) →
#                                  Kimi settings → spending ON (USD 3 allowance, USD 1 cap) → case → readiness
#   paid-deactivate                spending OFF (the Kimi key is kept)
#   paid-deactivate-and-remove-key spending OFF and the paid provider settings deleted
# A paid target also needs expected_sha: the full 40-character hash of the branch commit to run.
# Job "paid-gate" (no environment, no secret) refuses unless the run is a manual dispatch of this
# repository's authorised branch at exactly expected_sha, and the environment "staging-paid" is
# protected (owner as required reviewer, no admin bypass, only this branch). Only then can job
# "paid-staging" start; it waits for the owner's approval and then receives the environment's
# secrets SUPABASE_ACCESS_TOKEN (scoped sbp_… token) and KIMI_API_KEY, as environment variables
# of the two steps that need them, never on a command line, never printed.
# The paid jobs use no third-party action: git and the runner's own Node only.
#
# wa-preview-* targets (branch claude/whatsapp-integration only, exact expected_sha, environment
# wa-preview): the ISOLATED WhatsApp preview — a separate Supabase project and a separate Cloudflare
# Pages project. They refuse the prototype's project and site; see recovery-prototype/supabase/whatsapp/README.md.
# Deploys as the Pages project's PRODUCTION branch ("main"):
# https://revenue-recovery-v0.pages.dev
#
# Required repository settings (Settings → Secrets and variables → Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN            (Account › Cloudflare Pages › Edit — nothing else)
#              CLOUDFLARE_ACCOUNT_ID
#              VITE_SUPABASE_PUBLISHABLE_KEY   (public sb_publishable_… key)
#   Variables: VITE_SUPABASE_URL               (https://aqwdwswpmbnzmkvyuqil.supabase.co)
#
# Never put a secret / service-role key in the VITE_* values: anything VITE_* is
# compiled into public JavaScript. The "Check configuration" step refuses to build if so.

name: Deploy recovery prototype (Cloudflare Pages)

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to run (frontend = deploy the site; paid-* = Supabase staging paid configuration)
        type: choice
        required: true
        default: frontend
        options: [frontend, paid-readiness, paid-activate, paid-deactivate, paid-deactivate-and-remove-key, wa-preview-preflight, wa-preview-deploy, wa-preview-founder, wa-preview-readiness]
      expected_sha:
        description: Paid targets only — the full 40-character commit hash this run must execute
        type: string
        required: false
        default: ''
      founder_email:
        description: wa-preview-founder only — the email of a user already added to the PREVIEW Supabase project
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    # Only the development branch may be deployed.
    if: github.ref == 'refs/heads/claude/revenue-recovery-engine-stage-1-8xg8vf' && (inputs.target == 'frontend' || inputs.target == '')
    runs-on: ubuntu-24.04 # pinned: Playwright 1.56.1 cannot install Chromium on ubuntu-latest (26.04)
    concurrency:
      group: cloudflare-pages-revenue-recovery-v0
      cancel-in-progress: false
    timeout-minutes: 25
    defaults:
      run:
        working-directory: recovery-prototype
    env:
      CF_PAGES_PROJECT: revenue-recovery-v0
      EXPECTED_SUPABASE_URL: https://aqwdwswpmbnzmkvyuqil.supabase.co
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history: the deploy-tooling tests check the branch contains earlier reviewed
          # stages and read old commits (rollback code), which a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recovery-prototype/package-lock.json

      # Fails before building, without printing any value, if configuration is
      # missing or if a privileged key would be baked into the public bundle.
      - name: Check configuration
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          fail=0
          [ "$HAS_CF_TOKEN" = "true" ]   || { echo "::error::Secret CLOUDFLARE_API_TOKEN is not set"; fail=1; }
          [ "$HAS_CF_ACCOUNT" = "true" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is not set"; fail=1; }
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Repository variable VITE_SUPABASE_URL is not set"; fail=1
          elif [ "$VITE_SUPABASE_URL" != "$EXPECTED_SUPABASE_URL" ]; then
            echo "::error::VITE_SUPABASE_URL is not the staging project ($EXPECTED_SUPABASE_URL). Check spelling and remove any trailing slash."; fail=1
          fi
          key="$VITE_SUPABASE_PUBLISHABLE_KEY"
          case "$key" in
            "") echo "::error::Repository secret VITE_SUPABASE_PUBLISHABLE_KEY is not set"; fail=1 ;;
            sb_publishable_*) ;;
            sb_secret_*) echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is a SECRET key. Remove it, rotate it in Supabase, use the publishable key."; fail=1 ;;
            eyJ*)
              payload=$(printf '%s' "$key" | cut -d. -f2 | tr '_-' '/+')
              while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
              if ! printf '%s' "$payload" | base64 -d 2>/dev/null | grep -q '"role":"anon"'; then
                echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is a JWT that is not the anon key (possibly service_role). Rotate it and use the publishable key."; fail=1
              fi ;;
            *) echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY has an unrecognised format"; fail=1 ;;
          esac
          exit $fail

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Automated tests. Any failure stops the run before anything is built or deployed.
      # The browser suites use the Stage-1 build and a MOCKED Supabase (no credentials),
      # so the real Supabase values are blanked for these steps.
      - name: Unit tests
        run: npm run test:unit

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests — Stage-1 prototype
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
        run: npm run test:e2e

      - name: Browser tests — sign-in, onboarding and cases (mocked Supabase)
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
        run: npm run test:live

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/_headers
          grep -qF "connect-src 'self' $EXPECTED_SUPABASE_URL;" dist/_headers
          if grep -rqE 'sb_secret_[A-Za-z0-9]' dist; then echo "::error::A secret key was found in the build output"; exit 1; fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.141.0 pages deploy dist
          --project-name="$CF_PAGES_PROJECT"
          --branch=main
          --commit-hash="$GITHUB_SHA"

  # ------------------------------------------------------------------ paid staging
  # Shared by both paid jobs: fetch ONLY the authorised branch from the public repository with
  # plain git (no third-party action, no credential, nothing persisted) and check out exactly
  # expected_sha. Node: the runner image's own Node 22 (no setup action).

  paid-gate:
    if: >-
      github.repository == 'INVESTOR-bnb/conversation-intelligence-engine'
      && github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/claude/revenue-recovery-engine-stage-1-8xg8vf'
      && startsWith(inputs.target, 'paid-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: recovery-prototype
    steps:
      - name: Check out exactly expected_sha of the authorised branch (git only, no credential)
        working-directory: .
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          BRANCH: claude/revenue-recovery-engine-stage-1-8xg8vf
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_sha must be a full 40-character commit hash"; exit 1; }
          git init -q .
          git remote add origin "https://github.com/INVESTOR-bnb/conversation-intelligence-engine.git"
          git fetch -q --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout -q -B "$BRANCH" "$EXPECTED_SHA"

      - name: Use the runner's Node 22
        working-directory: .
        run: |
          dir="$(ls -d /opt/hostedtoolcache/node/22.*/x64 2>/dev/null | sort -V | tail -1)"
          [ -n "$dir" ] || { echo "::error::Node 22 is not available on this runner image"; exit 1; }
          echo "$dir/bin" >> "$GITHUB_PATH"

      - name: Gate (run, commit and environment protection; no secret exists in this job)
        env:
          TARGET: ${{ inputs.target }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node supabase/scripts/paid-staging-gate.mjs

      - name: Offline checks (no secret exists in this job; install scripts disabled)
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run typecheck
          npx playwright test --config playwright.unit.config.ts tests/unit/stage2a6d.spec.ts tests/unit/paidStagingWorkflow.spec.ts tests/unit/paidStagingGate.spec.ts

  paid-staging:
    needs: paid-gate
    if: >-
      github.repository == 'INVESTOR-bnb/conversation-intelligence-engine'
      && github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/claude/revenue-recovery-engine-stage-1-8xg8vf'
      && startsWith(inputs.target, 'paid-')
      && github.sha == inputs.expected_sha
      && needs.paid-gate.result == 'success'
    runs-on: ubuntu-24.04
    environment: staging-paid
    # One paid-staging operation at a time; one that has started is never cancelled.
    concurrency:
      group: paid-staging-supabase-aqwdwswpmbnzmkvyuqil
      cancel-in-progress: false
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: recovery-prototype
    steps:
      - name: Check out exactly expected_sha of the authorised branch (git only, no credential)
        working-directory: .
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          BRANCH: claude/revenue-recovery-engine-stage-1-8xg8vf
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$EXPECTED_SHA" = "$GITHUB_SHA" ] || { echo "::error::expected_sha mismatch"; exit 1; }
          git init -q .
          git remote add origin "https://github.com/INVESTOR-bnb/conversation-intelligence-engine.git"
          git fetch -q --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout -q -B "$BRANCH" "$EXPECTED_SHA"

      - name: Use the runner's Node 22
        working-directory: .
        run: |
          dir="$(ls -d /opt/hostedtoolcache/node/22.*/x64 2>/dev/null | sort -V | tail -1)"
          [ -n "$dir" ] || { echo "::error::Node 22 is not available on this runner image"; exit 1; }
          echo "$dir/bin" >> "$GITHUB_PATH"

      # Names only: says which required secret is missing, never a value.
      - name: Check required secrets (names only)
        env:
          TARGET: ${{ inputs.target }}
          HAS_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_KIMI_API_KEY: ${{ secrets.KIMI_API_KEY != '' }}
        run: |
          fail=0
          [ "$HAS_SUPABASE_ACCESS_TOKEN" = "true" ] || { echo "::error::Missing secret SUPABASE_ACCESS_TOKEN in environment staging-paid"; fail=1; }
          if [ "$TARGET" = "paid-activate" ] && [ "$HAS_KIMI_API_KEY" != "true" ]; then echo "::error::Missing secret KIMI_API_KEY in environment staging-paid"; fail=1; fi
          exit $fail

      # Code only: the deploy script writes NO provider setting in its default mode.
      - name: Deploy analyze-case code (provider settings untouched)
        if: inputs.target == 'paid-activate'
        env:
          RRE_NONINTERACTIVE: '1'
          CONFIRM_PROJECT_REF: aqwdwswpmbnzmkvyuqil
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash supabase/scripts/deploy-analyze-case-2a6d.sh

      - name: Run the chosen paid-staging action
        env:
          TARGET: ${{ inputs.target }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          case "$TARGET" in
            paid-readiness) action=readiness ;;
            paid-activate) action=activate ;;
            paid-deactivate) action=deactivate ;;
            paid-deactivate-and-remove-key) action=deactivate-and-remove-key ;;
            *) echo "::error::unknown target"; exit 1 ;;
          esac
          node supabase/scripts/paid-staging.mjs "$action"

  # ------------------------------------------------------------------ whatsapp preview (isolated)
  # Targets: wa-preview-preflight (Cloudflare check + separate Pages project, Supabase token probe if
  # configured; writes no Supabase data), wa-preview-deploy (resumable), wa-preview-founder,
  # wa-preview-readiness (infrastructure and founder account reported separately).
  wa-preview:
    if: >-
      github.repository == 'INVESTOR-bnb/conversation-intelligence-engine'
      && github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/claude/whatsapp-integration'
      && startsWith(inputs.target, 'wa-preview-')
      && github.sha == inputs.expected_sha
    runs-on: ubuntu-24.04
    environment: wa-preview
    concurrency:
      group: wa-preview
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: recovery-prototype
    env:
      TARGET: ${{ inputs.target }}
      WA_PREVIEW_PROJECT_REF: ${{ vars.WA_PREVIEW_PROJECT_REF }}
      WA_PREVIEW_PAGES_PROJECT: ${{ vars.WA_PREVIEW_PAGES_PROJECT || 'rre-whatsapp-preview' }}
    steps:
      - name: Check out exactly expected_sha of the WhatsApp branch (git only, no credential)
        working-directory: .
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          BRANCH: claude/whatsapp-integration
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$EXPECTED_SHA" = "$GITHUB_SHA" ] || { echo "::error::expected_sha mismatch"; exit 1; }
          git init -q .
          git remote add origin "https://github.com/INVESTOR-bnb/conversation-intelligence-engine.git"
          git fetch -q --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout -q -B "$BRANCH" "$EXPECTED_SHA"

      - name: Isolation guard (never the prototype's project or site)
        id: guard
        run: |
          case "$TARGET" in wa-preview-preflight|wa-preview-deploy|wa-preview-founder|wa-preview-readiness) ;; *) echo "::error::unknown target"; exit 1 ;; esac
          [[ "$WA_PREVIEW_PAGES_PROJECT" =~ ^[a-z0-9-]{3,58}$ ]] || { echo "::error::WA_PREVIEW_PAGES_PROJECT is not a Pages project name"; exit 1; }
          [ "$WA_PREVIEW_PAGES_PROJECT" != "revenue-recovery-v0" ] || { echo "::error::refused: that is the prototype's Pages project"; exit 1; }
          if [ "$TARGET" != "wa-preview-preflight" ] || [ -n "$WA_PREVIEW_PROJECT_REF" ]; then
            [[ "$WA_PREVIEW_PROJECT_REF" =~ ^[a-z]{20}$ ]] || { echo "::error::variable WA_PREVIEW_PROJECT_REF is not set"; exit 1; }
            [ "$WA_PREVIEW_PROJECT_REF" != "aqwdwswpmbnzmkvyuqil" ] || { echo "::error::refused: that is the prototype's Supabase project"; exit 1; }
          fi

      - name: Use the runner's Node 22
        working-directory: .
        run: |
          dir="$(ls -d /opt/hostedtoolcache/node/22.*/x64 2>/dev/null | sort -V | tail -1)"
          [ -n "$dir" ] || { echo "::error::Node 22 is not available on this runner image"; exit 1; }
          echo "$dir/bin" >> "$GITHUB_PATH"

      - name: Install and offline checks (deploy only)
        if: inputs.target == 'wa-preview-deploy'
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run typecheck
          npx playwright test --config playwright.unit.config.ts tests/unit/waTest.spec.ts tests/unit/whatsappHelpers.spec.ts tests/unit/waPreviewDeploy.spec.ts

      - name: Cloudflare credentials and the separate Pages project (created if absent; free)
        id: pages
        if: inputs.target != 'wa-preview-founder'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mode=create; [ "$TARGET" = "wa-preview-readiness" ] && mode=check
          node supabase/scripts/wa-preview-pages.mjs "$mode"

      - name: Placeholder page (preflight, only while the site has never been deployed)
        if: inputs.target == 'wa-preview-preflight' && steps.pages.outputs.has_deployment != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          site="$(mktemp -d)"; trap 'rm -rf "$site"' EXIT
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>RRE WhatsApp preview</title>' \
            '<p>RRE WhatsApp preview (isolated). Not configured yet: no data, no sign-in, nothing is sent.</p>' > "$site/index.html"
          printf '/*\n  X-Robots-Tag: noindex\n  X-Frame-Options: DENY\n' > "$site/_headers"
          npx --yes wrangler@4.141.0 pages deploy "$site" --project-name="$WA_PREVIEW_PAGES_PROJECT" --branch=main --commit-hash="$GITHUB_SHA"

      - name: Supabase token and project probe (read-only)
        if: inputs.target == 'wa-preview-preflight' || inputs.target == 'wa-preview-deploy'
        env:
          WA_PREVIEW_SUPABASE_ACCESS_TOKEN: ${{ secrets.WA_PREVIEW_SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "$TARGET" = "wa-preview-preflight" ] && { [ -z "$WA_PREVIEW_PROJECT_REF" ] || [ -z "$WA_PREVIEW_SUPABASE_ACCESS_TOKEN" ]; }; then
            echo "NOT READY  Supabase preview project: variable WA_PREVIEW_PROJECT_REF and/or secret WA_PREVIEW_SUPABASE_ACCESS_TOKEN not set in environment wa-preview"
            exit 0
          fi
          node supabase/scripts/wa-preview-deploy.mjs preflight

      - name: Supabase preview project (schema, settings, worker schedule; resumable)
        if: inputs.target == 'wa-preview-deploy'
        env:
          WA_PREVIEW_SUPABASE_ACCESS_TOKEN: ${{ secrets.WA_PREVIEW_SUPABASE_ACCESS_TOKEN }}
          WA_APP_ID: ${{ vars.WA_APP_ID }}
          WA_APP_SECRET: ${{ secrets.WA_APP_SECRET }}
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
          WA_ALLOWED_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: node supabase/scripts/wa-preview-deploy.mjs setup

      - name: Deploy the whatsapp and analyze-case functions to the preview project
        if: inputs.target == 'wa-preview-deploy'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.WA_PREVIEW_SUPABASE_ACCESS_TOKEN }}
        run: |
          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          (cd "$work" && npx --yes supabase@2.117.0 init </dev/null >/dev/null)
          mkdir -p "$work/supabase/functions"
          cp -R supabase/functions/whatsapp supabase/functions/analyze-case supabase/functions/_shared "$work/supabase/functions/"
          printf '\n[functions.whatsapp]\nverify_jwt = false\n\n[functions.analyze-case]\nverify_jwt = true\n' >> "$work/supabase/config.toml"
          for fn in whatsapp analyze-case; do
            npx --yes supabase@2.117.0 functions deploy "$fn" --use-api --project-ref "$WA_PREVIEW_PROJECT_REF" --workdir "$work"
          done

      - name: Build and deploy the preview site (separate Pages project)
        if: inputs.target == 'wa-preview-deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: https://${{ vars.WA_PREVIEW_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.WA_PREVIEW_PUBLISHABLE_KEY }}
          VITE_WHATSAPP_PREVIEW: '1'
          VITE_WA_APP_ID: ${{ vars.WA_APP_ID }}
          VITE_WA_ES_CONFIG_ID: ${{ vars.WA_ES_CONFIG_ID }}
        run: |
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) echo "::error::variable WA_PREVIEW_PUBLISHABLE_KEY must be the preview project's publishable key"; exit 1 ;; esac
          npx vite build --outDir dist-wa --emptyOutDir
          grep -q "connect.facebook.net" dist-wa/_headers
          if grep -rqE 'sb_secret_[A-Za-z0-9]' dist-wa; then echo "::error::A secret key was found in the build output"; exit 1; fi
          npx --yes wrangler@4.141.0 pages deploy dist-wa --project-name="$WA_PREVIEW_PAGES_PROJECT" --branch=main --commit-hash="$GITHUB_SHA"

      - name: Make an existing preview user the founder
        if: inputs.target == 'wa-preview-founder'
        env:
          WA_PREVIEW_SUPABASE_ACCESS_TOKEN: ${{ secrets.WA_PREVIEW_SUPABASE_ACCESS_TOKEN }}
          FOUNDER_EMAIL: ${{ inputs.founder_email }}
        run: node supabase/scripts/wa-preview-deploy.mjs founder

      - name: Infrastructure readiness (schema, switches off, settings, schedule, functions, webhook handshake, site)
        if: inputs.target == 'wa-preview-deploy' || inputs.target == 'wa-preview-readiness'
        env:
          WA_PREVIEW_SUPABASE_ACCESS_TOKEN: ${{ secrets.WA_PREVIEW_SUPABASE_ACCESS_TOKEN }}
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
          SITE: ${{ steps.pages.outputs.origin }}
        run: |
          ok=0; node supabase/scripts/wa-preview-deploy.mjs readiness || ok=1
          code="$(curl -s -o /dev/null -w '%{http_code}' --get --data-urlencode 'hub.mode=subscribe' --data-urlencode "hub.verify_token=$WA_VERIFY_TOKEN" --data-urlencode 'hub.challenge=4242' \
            "https://$WA_PREVIEW_PROJECT_REF.supabase.co/functions/v1/whatsapp/webhook")"
          echo "webhook handshake HTTP $code"; [ "$code" = 200 ] || ok=1
          curl -sf "$SITE/" -o /dev/null && echo "preview site reachable: $SITE" || { echo "preview site NOT reachable"; ok=1; }
          echo "RESULT: INFRASTRUCTURE $([ $ok = 0 ] && echo READY || echo 'NOT READY')"
          exit $ok

      - name: Founder-account readiness (separate from infrastructure)
        if: >-
          !cancelled() && steps.guard.outcome == 'success'
          && (inputs.target == 'wa-preview-founder' || inputs.target == 'wa-preview-readiness')
        env:
          WA_PREVIEW_SUPABASE_ACCESS_TOKEN: ${{ secrets.WA_PREVIEW_SUPABASE_ACCESS_TOKEN }}
        run: node supabase/scripts/wa-preview-deploy.mjs founder-readiness
